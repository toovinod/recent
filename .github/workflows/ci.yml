name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: recent
          POSTGRES_PASSWORD: recent
          POSTGRES_DB: recent_test
        ports:
          - 55432:5432
        options: --health-cmd "pg_isready -U recent" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4
        ports:
          - 56379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://recent:recent@127.0.0.1:55432/recent_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/13
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun audit
      - run: bun run check
      - run: bun run --cwd packages/db migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: bun run test
      - run: bun run build
